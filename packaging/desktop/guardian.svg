<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="40%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Shield Border Gold/Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5400"/>
      <stop offset="45%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <!-- Pulse Jade Emerald Gradient -->
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glass Surface Highlight Gradient -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="7"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="220" r="140" fill="#fb8500" opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="310" r="100" fill="#00f59b" opacity="0.08" filter="url(#glow)"/>

  <!-- Shield Outer Geometry -->
  <path d="M256 90 C340 90 404 124 404 124 C404 250 336 354 256 422 C176 354 108 250 108 124 C108 124 172 90 256 90 Z"
        fill="#0c101c" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Shield Inner Layer -->
  <path d="M256 118 C324 118 376 145 376 145 C376 248 322 334 256 392 C190 334 136 248 136 145 C136 145 188 118 256 118 Z"
        fill="#070912" opacity="0.95"/>

  <!-- Glass Arc Highlight on Top Shield -->
  <path d="M256 122 C320 122 370 148 370 148 C370 200 320 220 256 220 C192 220 142 200 142 148 C142 148 192 122 256 122 Z"
        fill="url(#glassHighlight)"/>

  <!-- Verification Pulse Line / Checkmark -->
  <path d="M196 256 L238 298 L318 206" 
        fill="none" stroke="url(#jadeGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Center Core Fusion Particle -->
  <circle cx="256" cy="256" r="10" fill="#ffb703" filter="url(#glow)"/>

  <!-- Mini Sentinel Indicator (Top Crown) -->
  <circle cx="256" cy="90" r="8" fill="#00f59b"/>
</svg>
