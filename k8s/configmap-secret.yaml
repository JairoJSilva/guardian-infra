apiVersion: v1
kind: ConfigMap
metadata:
  name: guardian-ops-config
  namespace: observability
  labels:
    app.kubernetes.io/name: guardian-ops
data:
  JIRA_BASE_URL: "https://jira.yourcompany.com"
  JIRA_PROJECT_KEY: "OPS"
  JIRA_ISSUE_TYPE: "Incident"
  GUARDIAN_COOLDOWN_MINUTES: "60"
  GUARDIAN_ENVIRONMENT: "Produção (Cluster Kubernetes)"
  GUARDIAN_DRY_RUN: "false"
  WEBHOOK_PORT: "8080"

---
apiVersion: v1
kind: Secret
metadata:
  name: guardian-ops-secret
  namespace: observability
  labels:
    app.kubernetes.io/name: guardian-ops
type: Opaque
stringData:
  # Preencha com as credenciais do seu Jira antes de aplicar
  JIRA_USER: "guardian-bot"
  JIRA_PASSWORD: "CHANGE_ME_IN_CLUSTER"
